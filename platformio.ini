[env:esp32]
platform = espressif32@6.4.0
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.5
    https://github.com/pschatzmann/arduino-libhelix.git#v0.9.4
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.9.6
    https://github.com/ESP32Async/AsyncTCP.git#v3.5.0



[env:esp32_nowifi]
extends = env:esp32
build_flags =
    ${env:esp32.build_flags}
    -DENABLE_WIFI=0
